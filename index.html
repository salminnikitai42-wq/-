<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Store 🐱💖🐰</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #FF6B8B;
      --primary-light: #FFEBF0;
      --secondary: #FF8DA1;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --text: #4A3E3D;
      --text-light: #8E7C7D;
      --krosh-color: #4A90E2;
      --krosh-bg: #EBF3FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .app-container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 32px; box-shadow: 0 12px 30px rgba(255, 107, 139, 0.15); display: flex; flex-direction: column; overflow: hidden; margin-bottom: 20px; position: relative; }
    
    /* Авторизация и регистрация */
    #authScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 14px; text-align: center; }
    .auth-tabs { display: flex; background: var(--bg); padding: 4px; border-radius: 14px; width: 100%; margin-bottom: 6px; }
    .auth-tab { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--text-light); }
    .auth-tab.active { background: white; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

    /* Шапка */
    .header { background: linear-gradient(135deg, #FF8DA1, #FF6B8B); color: white; padding: 20px 16px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; transition: background 0.3s; position: relative; }
    .header.krosh-mode { background: linear-gradient(135deg, #5CA0F2, #357ABD); }
    .settings-btn { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); border: none; border-radius: 12px; padding: 8px; font-size: 18px; cursor: pointer; transition: 0.2s; }
    .settings-btn:hover { background: rgba(255,255,255,0.4); }

    /* Модальное окно настроек */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: white; width: 100%; max-width: 340px; padding: 24px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    
    .main-nav-tabs { display: flex; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 16px; margin: 12px 16px 0 16px; gap: 4px; }
    .main-tab-btn { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--text-light); transition: all 0.2s; }
    .main-tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .character-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
    .character-avatar { font-size: 32px; background: white; border-radius: 50%; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); object-fit: cover; }
    .user-rating-badge { background: rgba(255, 255, 255, 0.3); padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 800; }

    .content { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 18px; padding: 0 8px; }
    .nav-btn { background: var(--bg); border: none; font-size: 18px; padding: 6px 14px; border-radius: 12px; cursor: pointer; font-weight: bold; color: var(--text); }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .weekday { font-size: 12px; font-weight: 700; color: var(--text-light); padding-bottom: 4px; }
    .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-weight: 700; cursor: pointer; background: var(--bg); position: relative; transition: all 0.2s; }
    .day-cell.today { border: 2px solid var(--primary); color: var(--primary); }
    .day-cell.has-wish::after { content: ''; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; position: absolute; bottom: 4px; }
    .day-cell.selected { background: var(--primary); color: white; }
    .day-cell.anniversary-day { background: #FFE0E6; border: 2px solid #FF3366; color: #FF3366; font-weight: 800; }

    .anniversary-banner { background: linear-gradient(135deg, #FF416C, #FF4B2B); color: white; padding: 12px; border-radius: 18px; text-align: center; font-weight: 800; font-size: 15px; }

    .section-card { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .nyusha-card { background: var(--primary-light); border: 2px dashed var(--secondary); }
    .krosh-card { background: var(--krosh-bg); border: 2px dashed #A0C4E8; }
    .honest-card { background: #FFF4E5; border: 2px dashed #FFB74D; }
    .game-card { background: #F0E6FF; border: 2px solid #D1B3FF; }
    
    .card-title { font-size: 16px; font-weight: 800; }
    
    .msg-carousel { position: relative; overflow: hidden; width: 100%; border-radius: 16px; background: white; padding: 14px; }
    .wish-text-box { font-size: 15px; line-height: 1.5; white-space: pre-line; min-height: 50px; }
    .wish-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; margin-top: 8px; }

    /* Оценки (звездочки) */
    .rating-stars { display: flex; justify-content: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(0,0,0,0.1); }
    .star-btn { background: none; border: none; font-size: 24px; cursor: pointer; transition: transform 0.2s; filter: grayscale(100%); opacity: 0.5; }
    .star-btn:hover { transform: scale(1.2); }
    
    .input-field { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid #E0E0E0; outline: none; font-size: 14px; }
    textarea.input-field { min-height: 70px; resize: vertical; }
    .save-btn { color: white; border: none; padding: 12px; border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 15px; transition: opacity 0.2s; }
    .save-btn-nyusha { background: var(--primary); }
    .save-btn-krosh { background: var(--krosh-color); }
    .save-btn-neutral { background: #9E9E9E; }

    /* МЕССЕНДЖЕР СТИЛИ */
    .chat-container { display: flex; flex-direction: column; height: 400px; background: #EBF3FA; border-radius: 20px; overflow: hidden; border: 2px solid #C2D9F0; }
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; position: relative; word-break: break-word; }
    .chat-bubble.incoming { background: white; color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-bubble.outgoing { background: #357ABD; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-sender-name { font-size: 11px; font-weight: 800; margin-bottom: 4px; opacity: 0.7; }
    
    .chat-input-area { display: flex; padding: 8px; background: white; gap: 6px; align-items: center; border-top: 1px solid #D1E3F5; }
    .chat-input { flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #D1E3F5; outline: none; font-size: 13px; }
    .media-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; }
    .chat-circle-video { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .chat-audio { width: 100%; max-width: 200px; height: 35px; }

    .discontent-item { background: white; padding: 12px; border-radius: 16px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid #FF9800; }
    .discontent-author { font-size: 12px; font-weight: 800; color: #E65100; }
    .resolve-btn { background: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 12px; align-self: flex-end; cursor: pointer; }

  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Экран авторизации и регистрации -->
    <div id="authScreen">
      <div style="font-size: 42px;">🐱💖🐰</div>
      <h2 style="color: var(--primary);">Love Store</h2>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLoginBtn" onclick="switchAuthMode('login')">Вход</button>
        <button class="auth-tab" id="tabRegBtn" onclick="switchAuthMode('register')">Регистрация</button>
      </div>

      <input type="text" id="authUsername" class="input-field" placeholder="Логин (например: nyusha)">
      <input type="password" id="authPassword" class="input-field" placeholder="Пароль">
      
      <button class="save-btn save-btn-nyusha" style="width: 100%;" id="authActionBtn" onclick="handleAuthAction()">Войти ✨</button>
    </div>

    <!-- Модальное окно Настроек -->
    <div id="settingsModal" class="modal-overlay">
      <div class="modal-content">
        <h3 style="text-align: center; color: var(--primary);">Настройки профиля ⚙️</h3>
        <label style="font-size: 12px; font-weight: bold; color: var(--text-light);">Твое имя (как видят другие):</label>
        <input type="text" id="setDisplayName" class="input-field" placeholder="Имя / Прозвище">
        
        <label style="font-size: 12px; font-weight: bold; color: var(--text-light);">Аватарка (Эмодзи или ссылка на фото):</label>
        <input type="text" id="setAvatar" class="input-field" placeholder="🐱 или https://...">
        
        <label style="font-size: 12px; font-weight: bold; color: var(--text-light);">Логин партнера (чья анкета привязана):</label>
        <input type="text" id="setPartnerId" class="input-field" placeholder="Логин партнера">
        
        <button class="save-btn save-btn-nyusha" onclick="saveSettings()">Сохранить изменения</button>
        <button class="save-btn save-btn-neutral" onclick="document.getElementById('settingsModal').style.display='none'">Отмена</button>
      </div>
    </div>

    <!-- Шапка приложения -->
    <div class="header" id="header">
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
      <div class="character-badge">
        <div class="character-avatar" id="avatarEmoji">🐱</div>
        <span id="headerGreeting" style="font-weight:800; font-size:18px;">Привет!</span>
        <div class="user-rating-badge" id="userRatingBadge">⭐ Рейтинг: 0.0</div>
      </div>
    </div>

    <!-- Главные вкладки переключения -->
    <div class="main-nav-tabs">
      <button class="main-tab-btn active" id="tabCalendarBtn" onclick="switchMainTab('calendar')">📅 Календарь</button>
      <button class="main-tab-btn" id="tabChatBtn" onclick="switchMainTab('chat')">💬 SkyChat</button>
      <button class="main-tab-btn" id="tabGamesBtn" onclick="switchMainTab('games')">🎮 Уголок</button>
    </div>

    <div class="content">
      
      <!-- ВКЛАДКА 1: КАЛЕНДАРЬ ПОЖЕЛАНИЙ -->
      <div id="tabCalendarContent" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="month-nav">
          <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
          <span id="monthYearText">Месяц Год</span>
          <button class="nav-btn" onclick="changeMonth(1)">❯</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div id="anniversaryBanner" class="anniversary-banner" style="display: none;">
          🎉 28 августа — День начала наших отношений! 💖✨
        </div>

        <div style="font-weight: 800; text-align: center; font-size: 15px;" id="selectedDateTitle">📅 Дата: сегодня</div>

        <div id="calendarRoleView" style="display: flex; flex-direction: column; gap: 16px;"></div>
      </div>

      <!-- ВКЛАДКА 2: МЕССЕНДЖЕР -->
      <div id="tabChatContent" style="display: none; flex-direction: column; gap: 12px;">
        <div style="font-weight: 800; font-size: 16px; color: var(--primary);">💬 Наш уютный SkyChat</div>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessagesList"></div>
          <div class="chat-input-area">
            <button class="media-btn" onclick="sendMediaPrompt('photo')" title="Фото">📷</button>
            <button class="media-btn" onclick="sendMediaPrompt('circle')" title="Кружочек">🔵</button>
            <button class="media-btn" onclick="sendMediaPrompt('audio')" title="Аудио">🎤</button>
            <input type="text" id="chatTextInput" class="chat-input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="save-btn save-btn-nyusha" style="padding: 8px 12px; font-size: 13px;" onclick="sendChatMessage()">➔</button>
          </div>
        </div>
      </div>

      <!-- ВКЛАДКА 3: ИГРЫ И УГОЛОК -->
      <div id="tabGamesContent" style="display: none; flex-direction: column; gap: 16px;">
        <div class="section-card honest-card">
          <div class="card-title" style="color: #E65100;">😤 Честный уголок</div>
          <div style="font-size: 13px; color: #8D6E63;">Выпиши тревоги или претензии, чтобы обсудить мирно.</div>
          <div id="discontentsList" style="display: flex; flex-direction: column; gap: 8px;"></div>
          <textarea id="honestInput" class="input-field" placeholder="Поделись, что не так..."></textarea>
          <button class="save-btn" style="background: #FF9800;" onclick="addDiscontent()">Поделиться 💬</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCWFh2iJw3uhhXZQ8OUPog0s6q-oRq_bUg",
      authDomain: "nikita-and-anna.firebaseapp.com",
      databaseURL: "https://nikita-and-anna-default-rtdb.firebaseio.com",
      projectId: "nikita-and-anna",
      storageBucket: "nikita-and-anna.firebasestorage.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentUser = null; // Логин текущего пользователя
    let myProfile = {}; // Данные профиля (имя, аватар, рейтинг)
    let authMode = 'login'; 

    // --- АВТОРИЗАЦИЯ И РЕГИСТРАЦИЯ ---
    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLoginBtn').className = `auth-tab ${mode === 'login' ? 'active' : ''}`;
      document.getElementById('tabRegBtn').className = `auth-tab ${mode === 'register' ? 'active' : ''}`;
      document.getElementById('authActionBtn').innerText = mode === 'login' ? 'Войти ✨' : 'Зарегистрироваться 🚀';
    }

    function handleAuthAction() {
      const u = document.getElementById('authUsername').value.trim().toLowerCase();
      const p = document.getElementById('authPassword').value.trim();

      if (!u || !p) return alert('Заполните все поля!');

      const userRef = db.ref('users_v2/' + u);

      if (authMode === 'register') {
        userRef.once('value', snapshot => {
          if (snapshot.exists()) {
            alert('Логин занят! Выберите другой или войдите.');
          } else {
            // Создаем профиль по умолчанию
            userRef.set({ 
              password: p, 
              displayName: u, 
              avatar: u.includes('nyusha') ? '🐱' : '🐰',
              partnerId: u.includes('nyusha') ? 'krosh' : 'nyusha',
              totalScore: 0,
              ratingCount: 0
            }).then(() => {
              alert('Регистрация успешна! ❤️');
              startSession(u);
            });
          }
        });
      } else {
        userRef.once('value', snapshot => {
          if (snapshot.exists() && snapshot.val().password === p) {
            startSession(u);
          } else {
            alert('Неверный логин или пароль!');
          }
        });
      }
    }

    function startSession(username) {
      currentUser = username;
      document.getElementById('authScreen').style.display = 'none';
      
      // Слушаем изменения своего профиля в реальном времени
      db.ref('users_v2/' + currentUser).on('value', snap => {
        myProfile = snap.val() || {};
        updateHeaderUI();
        initCalendar(); // перерисовываем, если поменялся партнер
      });

      listenMessages();
    }

    // --- НАСТРОЙКИ ПРОФИЛЯ ---
    function openSettings() {
      document.getElementById('setDisplayName').value = myProfile.displayName || currentUser;
      document.getElementById('setAvatar').value = myProfile.avatar || '🐱';
      document.getElementById('setPartnerId').value = myProfile.partnerId || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function saveSettings() {
      const newName = document.getElementById('setDisplayName').value.trim();
      const newAvatar = document.getElementById('setAvatar').value.trim();
      const newPartner = document.getElementById('setPartnerId').value.trim().toLowerCase();

      db.ref('users_v2/' + currentUser).update({
        displayName: newName || currentUser,
        avatar: newAvatar || '🐱',
        partnerId: newPartner
      }).then(() => {
        document.getElementById('settingsModal').style.display = 'none';
        alert('Настройки сохранены! ✨');
      });
    }

    function updateHeaderUI() {
      const isNyushaTheme = currentUser.includes('nyusha') || (myProfile.avatar && myProfile.avatar.includes('🐱'));
      document.getElementById('header').className = `header ${isNyushaTheme ? '' : 'krosh-mode'}`;
      
      // Если аватар - ссылка на картинку, делаем тег img, иначе просто текст (эмодзи)
      const av = myProfile.avatar || '💖';
      if (av.startsWith('http')) {
        document.getElementById('avatarEmoji').innerHTML = `<img src="${av}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
      } else {
        document.getElementById('avatarEmoji').innerText = av;
      }
      
      document.getElementById('headerGreeting').innerText = `Привет, ${myProfile.displayName}!`;
      
      // Считаем средний рейтинг
      let avg = 0.0;
      if (myProfile.ratingCount > 0) {
        avg = (myProfile.totalScore / myProfile.ratingCount).toFixed(1);
      }
      document.getElementById('userRatingBadge').innerText = `⭐ Очки любви: ${avg}`;
    }

    // --- НАВИГАЦИЯ ---
    function switchMainTab(tab) {
      document.getElementById('tabCalendarBtn').className = `main-tab-btn ${tab === 'calendar' ? 'active' : ''}`;
      document.getElementById('tabChatBtn').className = `main-tab-btn ${tab === 'chat' ? 'active' : ''}`;
      document.getElementById('tabGamesBtn').className = `main-tab-btn ${tab === 'games' ? 'active' : ''}`;

      document.getElementById('tabCalendarContent').style.display = tab === 'calendar' ? 'flex' : 'none';
      document.getElementById('tabChatContent').style.display = tab === 'chat' ? 'flex' : 'none';
      document.getElementById('tabGamesContent').style.display = tab === 'games' ? 'flex' : 'none';
    }

    // --- КАЛЕНДАРЬ ---
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    let currDate = new Date();
    let currentYear = currDate.getFullYear();
    let currentMonth = currDate.getMonth();
    let selectedDateKey = getTodayKey();
    let wishesData = {};

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    db.ref('wishes_v3').on('value', (snapshot) => {
      wishesData = snapshot.val() || {};
      if (currentUser) initCalendar();
    });

    function changeMonth(offset) {
      currentMonth += offset;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      initCalendar();
    }

    function initCalendar() {
      if (!currentUser) return;
      document.getElementById('monthYearText').innerText = `${monthNames[currentMonth]} ${currentYear}`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '<div class="weekday">Пн</div><div class="weekday">Вт</div><div class="weekday">Ср</div><div class="weekday">Чт</div><div class="weekday">Пт</div><div class="weekday">Сб</div><div class="weekday">Вс</div>';
      
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDay = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;

      for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = day;

        if (currentMonth === 7 && day === 28) cell.classList.add('anniversary-day');
        if (dateKey === getTodayKey()) cell.classList.add('today');
        
        // Показываем точку, если на этот день есть сообщения (от нас или нам)
        const dData = wishesData[dateKey] || {};
        if (dData[currentUser] || (myProfile.partnerId && dData[myProfile.partnerId])) {
          cell.classList.add('has-wish');
        }
        
        if (dateKey === selectedDateKey) cell.classList.add('selected');

        cell.onclick = () => { selectedDateKey = dateKey; initCalendar(); };
        grid.appendChild(cell);
      }
      renderCalendarView();
    }

    function renderCalendarView() {
      document.getElementById('selectedDateTitle').innerText = `📅 Дата: ${selectedDateKey}`;
      document.getElementById('anniversaryBanner').style.display = selectedDateKey.endsWith('-08-28') ? 'block' : 'none';

      const dayData = wishesData[selectedDateKey] || {};
      const container = document.getElementById('calendarRoleView');
      
      const partnerId = myProfile.partnerId;
      if (!partnerId) {
        container.innerHTML = `<div style="text-align:center; color:gray; font-size:14px; padding: 20px;">Укажите логин партнера в настройках ⚙️, чтобы обмениваться пожеланиями!</div>`;
        return;
      }

      // То, что партнер написал МНЕ:
      const partnerWishes = dayData[partnerId] || [];
      const msgList = Array.isArray(partnerWishes) ? partnerWishes : Object.values(partnerWishes);
      const partnerLastMsg = msgList.length > 0 ? msgList[msgList.length - 1] : null;

      // Формируем блок оценки, если есть сообщение от партнера
      let ratingHTML = '';
      if (partnerLastMsg) {
        ratingHTML = `
          <div class="rating-stars">
            <div style="font-size:12px; width:100%; text-align:center; color:#888;">Оценить сообщение партнера:</div>
            <button class="star-btn" onclick="ratePartner(1)">❤️</button>
            <button class="star-btn" onclick="ratePartner(3)">❤️❤️</button>
            <button class="star-btn" onclick="ratePartner(5)">🔥</button>
          </div>`;
      }

      container.innerHTML = `
        <div class="section-card nyusha-card">
          <div class="card-title">💌 Послание от партнера:</div>
          <div class="msg-carousel">
            <div class="wish-text-box">${partnerLastMsg ? partnerLastMsg.text : 'Тишина...'}</div>
            ${partnerLastMsg && partnerLastMsg.img ? `<img class="wish-img" src="${partnerLastMsg.img}">` : ''}
            ${ratingHTML}
          </div>
        </div>

        <div class="section-card krosh-card">
          <div class="card-title">✍️ Отправить послание:</div>
          <textarea id="wishText" class="input-field" placeholder="Напиши что-то приятное..."></textarea>
          <input type="text" id="wishImg" class="input-field" placeholder="Ссылка на картинку (необязательно)...">
          <button class="save-btn save-btn-krosh" onclick="saveWish()">Отправить ❤️</button>
        </div>
      `;
    }

    // --- ОТПРАВКА И ОЦЕНКА ПОЖЕЛАНИЙ ---
    function saveWish() {
      const text = document.getElementById('wishText').value.trim();
      const img = document.getElementById('wishImg').value.trim();
      if (!text) return alert('Введите текст!');

      // Сохраняем в СВОЮ ветку (currentUser), чтобы партнер читал из нашей ветки
      const path = `wishes_v3/${selectedDateKey}/${currentUser}`;
      const dayData = wishesData[selectedDateKey] || {};
      const list = Array.isArray(dayData[currentUser]) ? [...dayData[currentUser]] : [];
      list.push({ text, img, timestamp: Date.now() });

      db.ref(path).set(list).then(() => {
        alert('Послание отправлено! 💖');
      });
    }

    // Эта функция отправляет очки любви В ПРОФИЛЬ ПАРТНЕРА!
    function ratePartner(score) {
      const partnerId = myProfile.partnerId;
      if (!partnerId) return;

      db.ref(`users_v2/${partnerId}`).once('value', snap => {
        const pData = snap.val() || {};
        const total = (pData.totalScore || 0) + score;
        const count = (pData.ratingCount || 0) + 1;
        
        db.ref(`users_v2/${partnerId}`).update({
          totalScore: total,
          ratingCount: count
        }).then(() => {
          alert(`Оценка отправлена! Рейтинг партнера повышен на ${score} ❤️`);
        });
      });
    }

    // --- МЕССЕНДЖЕР ---
    function listenMessages() {
      db.ref('chat_messages_v2').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('chatMessagesList');
        if (!list) return;
        list.innerHTML = '';
        
        // Сортируем по времени
        const sortedMsgs = Object.values(data).sort((a,b) => a.time - b.time);

        sortedMsgs.forEach(msg => {
          const div = document.createElement('div');
          const isOutgoing = msg.senderId === currentUser;
          div.className = `chat-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
          
          let contentHtml = `<div class="chat-sender-name">${msg.senderName}</div>`;
          
          if (msg.type === 'text') {
            contentHtml += `${msg.text}`;
          } else if (msg.type === 'photo') {
            contentHtml += `<img src="${msg.url}" style="width:100%; border-radius:12px;">`;
          } else if (msg.type === 'circle') {
            contentHtml += `<video class="chat-circle-video" src="${msg.url}" autoplay loop muted playsinline></video>`;
          } else if (msg.type === 'audio') {
            contentHtml += `<audio class="chat-audio" controls src="${msg.url}"></audio>`;
          }
          
          div.innerHTML = contentHtml;
          list.appendChild(div);
        });
        list.scrollTop = list.scrollHeight;
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chatTextInput');
      const text = input.value.trim();
      if (!text) return;

      db.ref('chat_messages_v2').push({
        senderId: currentUser,
        senderName: myProfile.displayName || currentUser,
        type: 'text',
        text: text,
        time: Date.now()
      });
      input.value = '';
    }

    function sendMediaPrompt(type) {
      let url = prompt(`Введите ссылку на ${type === 'photo' ? 'фотографию' : type === 'circle' ? 'видео-кружочек (mp4)' : 'аудиофайл'}:`);
      if (!url) return;

      db.ref('chat_messages_v2').push({
        senderId: currentUser,
        senderName: myProfile.displayName || currentUser,
        type: type,
        url: url,
        time: Date.now()
      });
    }

    // --- ЧЕСТНЫЙ УГОЛОК ---
    function addDiscontent() {
      const txt = document.getElementById('honestInput').value.trim();
      if (!txt) return;
      db.ref('discontents_v2').push({ 
        text: txt, 
        author: myProfile.displayName || currentUser, 
        time: new Date().toLocaleDateString() 
      }).then(() => {
        document.getElementById('honestInput').value = '';
      });
    }

    db.ref('discontents_v2').on('value', (snapshot) => {
      const container = document.getElementById('discontentsList');
      if (!container) return;
      container.innerHTML = '';
      const data = snapshot.val() || {};
      Object.keys(data).forEach(k => {
        const item = data[k];
        container.innerHTML += `<div class="discontent-item"><div class="discontent-author">${item.author}:</div><div>${item.text}</div><button class="resolve-btn" onclick="db.ref('discontents_v2/${k}').remove()">Решено ❤️</button></div>`;
      });
    });
  </script>
</body>
</html>
